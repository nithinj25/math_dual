# Production stack for a single host. Only Caddy publishes ports; everything
# else is reachable solely on the internal Docker network.
#
# Bring up:  docker compose -f docker-compose.prod.yml up -d --build
name: mathduel

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates live here: losing it re-issues
      - caddy_config:/config
    depends_on: [api, gateway, frontend]

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines these at build time, so changing any of them needs
        # a rebuild of this image, not a restart of the container.
        VITE_API_URL: https://${DOMAIN}/api
        VITE_GATEWAY_URL: wss://${DOMAIN}/ws
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set VITE_SUPABASE_ANON_KEY in .env}
    restart: unless-stopped

  # Exactly one replica, always. Live Duel objects are held in this process's
  # memory (modules/game/registry.py), so a second instance would answer
  # DuelNotFound for every match it did not create.
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mathduel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/mathduel
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP: kafka:9092
      CORS_ORIGINS: https://${DOMAIN}
      AUTH_MODE: real
      ENVIRONMENT: production
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:?set SUPABASE_JWT_ISSUER in .env}
      SUPABASE_JWT_AUD: authenticated
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?set SUPABASE_JWKS_URL in .env}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      API_URL: http://api:8000
      WS_PORT: 8080
    depends_on:
      redis: { condition: service_healthy }

  consumer:
    build: ./api
    restart: unless-stopped
    command: ["python", "consumer.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on: [kafka]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mathduel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mathduel
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs *.sql alphabetically on FIRST boot only. 001/002/003 already sort
      # correctly. Later migrations must be applied by hand — the files use
      # bare CREATE TABLE, so re-running them errors.
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathduel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Leaderboards rebuild from Postgres, but persistence saves the rebuild
    # and keeps in-flight rooms across a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Must be the compose service name. Advertising 127.0.0.1 here would let
      # clients connect once and then fail every request after metadata.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data

volumes:
  pgdata:
  redisdata:
  kafkadata:
  caddy_data:
  caddy_config:
