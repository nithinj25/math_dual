services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mathduel
      POSTGRES_PASSWORD: mathduel
      POSTGRES_DB: mathduel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathduel"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # 6380 on the host: a WSL-hosted Redis already owns 127.0.0.1:6379 and
      # would silently shadow this one, since it binds a more specific address
      # than Docker's wildcard.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
